<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="bi bi-robot me-2"></i>Assistant IA</h5>
    </div>
    <div class="card-body">
      <div class="input-group">
        <input [(ngModel)]="query" (keyup.enter)="askAgentStream()" type="text" class="form-control"
               placeholder="Ex : liste des comptes du client 1 sous forme de tableau">
        <button (click)="askAgentStream()" class="btn btn-primary">
          @if (loadingService.isLoading()) {
            <span class="spinner-border spinner-border-sm" role="status"></span>
          } @else {
            <i class="bi bi-send"></i>
          }
        </button>
      </div>

      @if (response$ | async; as botResponse) {
        @if (botResponse.type === 'Response') {
          <div class="mt-4 p-3 bg-light border rounded">
            <div class="small text-muted mb-2"><i class="bi bi-robot me-1"></i>Réponse</div>
            <markdown [data]="botResponse.content"></markdown>
          </div>
        }
      }
    </div>
  </div>
</div>
