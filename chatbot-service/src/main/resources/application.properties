spring.application.name=chatbot-service
server.port=8083

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.bank-account-service.url=http://localhost:8082

discord.token=${DISCORD_TOKEN}
telegram.token=${TELEGRAM_BOT_TOKEN}

eureka.client.jersey.enabled=false